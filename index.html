<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baked by Nyamsy — Artisan Cupcake Bakery</title>

  <!-- Poppins = UI text; Pacifico = the handwritten headline, wordmark and flavor name -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===================== HERO (only section on the page) ===================== -->
  <header class="hero">

    <!-- Header row: wordmark (left) + hamburger (right). On desktop the wrapper
         is inert and both children float absolutely; on mobile it is a flex row. -->
    <div class="hero-topbar">

      <!-- Wordmark — single self-contained element. Delete this <a> to remove it. -->
      <a class="hero-wordmark" href="#top">Baked by Nyamsy</a>

      <!-- Menu button: plain chocolate bars on the neutral bg -->
      <button class="hero-menu-btn" type="button"
              aria-label="Open menu" aria-expanded="false" aria-controls="hero-panel">
        <span></span><span></span><span></span>
      </button>
    </div>

    <!-- Headline — edit the text and the caramel word here -->
    <h1 class="hero-headline">One bite and you'll <span class="hero-headline-accent">understand.</span></h1>

    <!-- ===================== Focus carousel ===================== -->
    <div class="hero-carousel" id="hero-carousel"
         role="region" aria-roledescription="carousel" aria-label="Featured cupcakes"
         tabindex="0">

      <div class="hero-track">

        <!--
          Flavor data lives here, on each slide:
            data-flavor : name shown in the info block + CTA label + thumbnail label
            data-desc   : description shown under the name
            data-order  : the order link. Replace "#order" with your WhatsApp
                          link, e.g. https://wa.me/2547XXXXXXXX?text=Hi!%20I'd%20like%20to%20order%20the%20Red%20Velvet
                          (the ?text= value is the prefilled message — URL-encode it)
            data-price  : optional; leave empty for now. If filled, it shows
                          beside the flavor name.
        -->
        <figure class="hero-slide"
                data-flavor="Red Velvet"
                data-desc="Velvety, cocoa-kissed and crowned with tangy cream cheese frosting. The one that makes people say 'wait, what's in this?'"
                data-order="#order"
                data-price=""
                aria-roledescription="slide" aria-label="1 of 4">
          <!-- Replace with transparent PNG/WebP cutout of cupcake -->
          <img src="images/red-velvet.png"
               alt="Red velvet cupcake with cream cheese frosting"
               width="420" height="525" draggable="false">
        </figure>

        <figure class="hero-slide"
                data-flavor="Chocolate"
                data-desc="Deep, fudgy and unapologetically chocolatey. For people who mean it."
                data-order="#order"
                data-price=""
                aria-roledescription="slide" aria-label="2 of 4">
          <!-- Replace with transparent PNG/WebP cutout of cupcake -->
          <img src="images/chocolate.png"
               alt="Chocolate cupcake swirled with dark cocoa ganache frosting"
               width="420" height="525" draggable="false">
        </figure>

        <figure class="hero-slide"
                data-flavor="Oreo &amp; Cream"
                data-desc="Crushed cookie crunch in every bite, swirled with cloud-soft cream. Dangerous with milk."
                data-order="#order"
                data-price=""
                aria-roledescription="slide" aria-label="3 of 4">
          <!-- Replace with transparent PNG/WebP cutout of cupcake -->
          <img src="images/oreo-cream.png"
               alt="Cookies and cream cupcake topped with an Oreo cookie half"
               width="420" height="525" draggable="false">
        </figure>

        <figure class="hero-slide"
                data-flavor="Vanilla"
                data-desc="Soft, buttery and golden, with real vanilla. Simple on purpose, and the first to disappear."
                data-order="#order"
                data-price=""
                aria-roledescription="slide" aria-label="4 of 4">
          <!-- Replace with transparent PNG/WebP cutout of cupcake -->
          <img src="images/vanilla.png"
               alt="Vanilla cupcake with piped vanilla bean buttercream"
               width="420" height="525" draggable="false">
        </figure>

      </div>

      <!-- Thumbnail pagination is generated by script.js into .hero-thumbs below -->
    </div>

    <!-- ===================== Flavor info block =====================
         Kept in sync with the active slide by initHeroInfo() in script.js.
         Pre-filled with the starting flavor (Chocolate) so it is correct before
         JS runs. pointer-events pass through so swipes still start over this
         area (the CTA re-enables them). -->
    <div class="hero-info">
      <h2 class="hero-info-name">
        <span class="hero-info-name-text">Chocolate</span><span class="hero-info-price" hidden></span>
      </h2>
      <p class="hero-info-desc" aria-live="polite">Deep, fudgy and unapologetically chocolatey. For people who mean it.</p>
      <a class="hero-cta" href="#order">
        <svg class="hero-cta-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M12 2.2c.6 1.6.2 2.7-.6 3.5 1.9-.3 3.3.6 3.6 2 2.3.5 3.7 2.3 3.4 4.3H5.6c-.3-2 1.1-3.8 3.4-4.3-.6-1.6.2-3 3-5.5Z"/>
          <path fill="currentColor" d="M5.8 13.2h12.4l-1.1 6.5a2 2 0 0 1-2 1.6H8.9a2 2 0 0 1-2-1.6Z"/>
        </svg>
        <span class="hero-cta-label">Order Chocolate</span>
      </a>
    </div>

    <!-- ===================== Mini cupcake thumbnails (pagination) =====================
         Buttons are generated by script.js — one per slide, using each slide's
         image. Clicking one centers that flavor; the active one follows the
         carousel's "slidechange" event. Sits outside the carousel so a press
         here never starts a swipe. -->
    <div class="hero-thumbs" role="group" aria-label="Choose a flavor"></div>

    <!-- Slide-in menu: dim overlay + right-hand panel (shadow wrapper carries
         the drop-shadow because clip-path would clip a box-shadow) -->
    <div class="hero-overlay"></div>

    <div class="hero-panel-shadow">
      <nav class="hero-panel" id="hero-panel" aria-label="Main menu" inert>
        <button class="hero-panel-close" type="button" aria-label="Close menu">&times;</button>
        <!-- Edit the menu links here -->
        <ul class="hero-panel-list">
          <li><a href="#top">Home</a></li>
          <li><a href="#cupcakes">Cup Cakes</a></li>
          <li><a href="#best-sellers">Best Sellers</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
        <svg class="hero-panel-deco" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <circle cx="24" cy="8" r="3" fill="var(--cocoa)"/>
          <path d="M11 24c-.8-4.6 2.3-7.6 5.4-8C16 11 19.5 8.5 24 8.5S32 11 31.6 16c3.1.4 6.2 3.4 5.4 8Z"
                fill="var(--rose)" stroke="var(--cocoa)" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M12 24h24l-3.2 15.6a2.4 2.4 0 0 1-2.4 1.9H17.6a2.4 2.4 0 0 1-2.4-1.9Z"
                fill="var(--caramel)" stroke="var(--cocoa)" stroke-width="2.5" stroke-linejoin="round"/>
          <rect x="4" y="34" width="4" height="9" rx="2" fill="var(--wheat)" transform="rotate(24 6 38)"/>
          <rect x="40" y="30" width="4" height="9" rx="2" fill="var(--sage)" transform="rotate(-30 42 34)"/>
        </svg>
      </nav>
    </div>

  </header>

  <script src="script.js"></script>
</body>
</html>
